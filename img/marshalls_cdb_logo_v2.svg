<svg width="100%" viewBox="0 0 680 210" role="img" xmlns="http://www.w3.org/2000/svg" style="">
  <title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Marshalls CDB logo</title>
  <desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Logo Marshalls CDB com cor editável via SVG</desc>

  <defs>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&amp;display=swap"/>
    
  </defs>

  <!-- "Marshalls" path-based using HTML overlay trick via foreignObject -->
  <!-- Using text with matching font -->
  <text id="t-marshalls" x="10" y="148" font-family="'Nunito', 'Arial Rounded MT Bold', 'Varela Round', sans-serif" font-weight="900" font-size="148" font-style="normal" letter-spacing="-1" style="fill:rgb(26, 48, 96);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Nunito, &quot;Arial Rounded MT Bold&quot;, &quot;Varela Round&quot;, sans-serif;font-size:148px;font-weight:900;text-anchor:start;dominant-baseline:auto">Marshalls</text>

  <text id="t-cdb" x="648" y="195" text-anchor="end" font-family="'Nunito', 'Arial Rounded MT Bold', 'Varela Round', sans-serif" font-weight="900" font-size="44" font-style="normal" letter-spacing="4" style="fill:rgb(26, 48, 96);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Nunito, &quot;Arial Rounded MT Bold&quot;, &quot;Varela Round&quot;, sans-serif;font-size:44px;font-weight:900;text-anchor:end;dominant-baseline:auto">CDB</text>

